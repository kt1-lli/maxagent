# MaxAgent CI/CD — 开源版：源码直出 mzp
#
# 触发:
#   - push tag v*.*.*  -> 自动打包 + 发布到 Release
#   - push master      -> 跑一遍预检和冒烟打包
#   - pull_request     -> 仅跑预检
#   - workflow_dispatch -> 手动触发
#
# 与旧版差异：
#   - 不再需要 5 个 Python ABI 矩阵，也不再有 Cython/PyArmor 步骤
#   - 单一 job 就能完成全部打包，因为纯源码 mzp 不依赖对应版本 Python

name: release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version_override:
        description: '可选版本号覆盖（留空则用 release/version.py）'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

jobs:

  # ============================================================
  # 阶段 1: 兼容性预检
  # ============================================================
  precheck:
    name: 预检
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: 装依赖
        run: |
          python -m pip install -U pip
          python -m pip install flake8

      - name: PEP8 检查（lint）
        run: |
          flake8 maxagent/ --max-line-length=120 --extend-ignore=W503,E203 --statistics --count

      - name: Python 3.13 兼容性 grep
        run: |
          set -e
          if grep -RnE 'asyncio\.get_event_loop\b' maxagent/; then
            echo '::warning::检测到 asyncio.get_event_loop，3.13 需迁移到 asyncio.new_event_loop'
          fi
          if grep -RnE '\bimport\s+distutils\b|\bfrom\s+distutils\b' maxagent/; then
            echo '::error::检测到 distutils 导入，3.12+ 已移除'
            exit 1
          fi

      - name: build.py dry-run
        run: |
          python release/build.py --dry-run

  # ============================================================
  # 阶段 2: mzp 打包（单 job，源码直接打包）
  # ============================================================
  pack:
    name: pack-mzp
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: 覆盖版本号（可选）
        if: github.event.inputs.version_override != ''
        run: |
          python release/build.py --version '${{ github.event.inputs.version_override }}' --dry-run

      - name: 读版本号
        id: read-version
        run: |
          ver=$(python -c "import sys; sys.path.insert(0,'release'); from version import __version__; print(__version__)")
          echo "版本号: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: 打包 mzp
        run: |
          python release/build.py --verbose
          ls -la release/dist/

      - name: 上传 mzp 制品
        uses: actions/upload-artifact@v4
        with:
          name: maxagent-mzp-${{ steps.read-version.outputs.version }}
          path: release/dist/*.mzp
          retention-days: 90

  # ============================================================
  # 阶段 3: 发布到 GitHub Release（仅 tag 推送触发）
  # ============================================================
  publish:
    name: 发布 Release
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载 mzp 制品
        uses: actions/download-artifact@v4
        with:
          name: maxagent-mzp-${{ needs.pack.outputs.version }}
          path: dist/

      - name: 生成 Release Notes
        id: notes
        run: |
          ver='${{ needs.pack.outputs.version }}'
          mzp=$(ls dist/*.mzp | head -1)
          size_mb=$(du -m "$mzp" | cut -f1)
          {
            echo "# MaxAgent v$ver"
            echo ''
            echo '## 兼容性'
            echo '- 3ds Max 2022 ~ 2027'
            echo '- Python 3.7 / 3.9 / 3.10 / 3.11 / 3.13（源码直出，一份代码全兼容）'
            echo ''
            echo '## 安装'
            echo '将 .mzp 文件直接拖入 3ds Max 视口即可自动安装。'
            echo ''
            echo "## 产物"
            echo "- 文件: \`$(basename "$mzp")\`"
            echo "- 大小: ${size_mb} MB"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mzp
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: 同步发布到 Gitee Release（可选）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: 'cmqll'
          GITEE_REPO: 'max_agent'
        if: env.GITEE_TOKEN != ''
        run: |
          python release/ci/publish_gitee.py \
            --version '${{ needs.pack.outputs.version }}' \
            --mzp-glob 'dist/*.mzp' \
            --notes-file RELEASE_NOTES.md
