# 工蜂蓝盾流水线 — MaxAgent 源码直出 mzp
#
# 主流水线: .github/workflows/release.yml (GitHub Actions)
# 本文件:   工蜂蓝盾备用配置
#
# 触发: master 分支推送 / git tag v*.*.* 推送 / 手动
# 说明: 开源版不再有 Cython/PyArmor/ABI 矩阵，单 job 直接打包源码 mzp

stages:
  - name: 兼容性预检
    jobs:
      - name: lint
        os: linux
        steps:
          - name: 拉取代码
            uses: checkout@v1
          - name: 装 Python 3.11
            uses: setup-python@v1
            with:
              version: 3.11.9
          - name: 装依赖
            run: |
              python -m pip install -U pip
              python -m pip install flake8
          - name: PEP8 检查
            run: |
              flake8 maxagent/ --max-line-length=120 --extend-ignore=W503,E203
          - name: build.py dry-run
            run: |
              python release/build.py --dry-run

  - name: mzp 打包
    jobs:
      - name: pack-mzp
        os: linux
        depends:
          - lint
        steps:
          - uses: checkout@v1
          - name: 装 Python 3.11
            uses: setup-python@v1
            with:
              version: 3.11.9
          - name: 打包源码 mzp
            run: |
              python release/build.py --verbose
          - name: 上传 mzp 制品
            uses: upload-artifact@v1
            with:
              name: maxagent-mzp
              path: release/dist/*.mzp

  - name: 发布到 Gitee Release
    jobs:
      - name: publish-gitee
        os: linux
        depends:
          - pack-mzp
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
          - uses: checkout@v1
          - name: 装 Python 3.11
            uses: setup-python@v1
            with:
              version: 3.11.9
          - name: 下载 mzp 产物
            uses: download-artifact@v1
            with:
              name: maxagent-mzp
              path: dist/
          - name: 推送 Gitee Release
            env:
              GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
              GITEE_OWNER: cmqll
              GITEE_REPO: max_agent
            run: |
              python release/ci/publish_gitee.py --mzp-glob 'dist/*.mzp'
