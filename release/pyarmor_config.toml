# PyArmor 8 加密配置
#
# 用于 Tier-3 文件（约 50 个 .py / 22500 行）的字节码加密
#
# 模式说明：
# - rft: Runtime Free Tools，产物本质是加密 .pyc + 极小 runtime helper
# - 体积小、加载快，但保护强度仅 L2
# - Tier-1/Tier-2 文件由 Cython 编译为 .pyd 提供 L3.5 保护，不走 PyArmor

[pyarmor]
mode = "rft"
# 是否绑定到 Python 版本（必须为 true，否则跨版本加载失败）
restrict_python_version = true

# 是否绑定到机器（false = 任意机器可运行）
bind_to_machine = false

# 加密强度
# 1 = 仅模糊化字面量
# 2 = 模糊化 + 字节码混淆（默认推荐）
# 3 = 模糊化 + 混淆 + 跳板（最强但启动稍慢）
obfuscation_level = 2

# 排除的源文件（必须保留 .py 明文）
excludes = [
    "__init__.py",      # 包入口
    "reload.py",        # 热重载逻辑自身必须明文
    "qt_compat.py",     # PySide2/6 兼容层，需 import 阶段尽早执行
]

# 同时也排除 Cython 白名单里的文件（避免双重加密冲突）
# build.py 会自动从 cython_modules.txt 读取并合并
exclude_cython_listed = true

# 资源文件（不加密，仅打包）
[resources]
include_globs = [
    "**/*.png",
    "**/*.svg",
    "**/*.ico",
    "**/*.json",
    "**/*.md",
]

# 输出
[output]
# build.py 会按 ABI 写入 build_cache/cpXX/maxagent/
# 此处只是默认值，build.py 通过命令行覆盖
default_dir = "build_cache"
