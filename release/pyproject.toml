# pyproject.toml —— 发布流水线的构建依赖与工具配置
#
# 仅服务于 release/build.py 的打包流程，
# 不影响 maxagent/ 包在运行时的依赖（运行时零外部依赖）。

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "cython>=3.0.11",
]
build-backend = "setuptools.build_meta"

[project]
name = "maxagent-release"
description = "MaxAgent release pipeline (Cython + PyArmor + mzp)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
dynamic = ["version"]

[tool.maxagent-release]
# 单一版本号源
version_file = "version.py"
# Cython 白名单
cython_listfile = "cython_modules.txt"
# PyArmor 配置
pyarmor_config = "pyarmor_config.toml"
# 安装钩子
mzp_install_script = "mzp_install.ms"
# 共享资源
shared_dir = "shared"
# 中间产物 / 最终产物
build_cache_dir = "build_cache"
dist_dir = "dist"

# Cython 编译指令（默认应用于所有白名单文件）
[tool.maxagent-release.cython_directives]
language_level = 3
binding = true
embedsignature = true
boundscheck = false
wraparound = false
cdivision = true
# 关闭文档字符串嵌入以减小 .pyd 体积（同时减少 prompt 文本泄漏面）
docstrings = false
# 开发期可改 true 方便调试，正式发布必须 false
linetrace = false

# 哪些 ABI 必须构建
[tool.maxagent-release.abi_matrix]
required = ["cp37", "cp39", "cp310", "cp311", "cp313"]
# 当本地无对应 Python 时是否跳过（CI 必须 false，本地开发可 true）
allow_skip_missing = true

# 开发期辅助：build.py --quick 时只构建一个 ABI 加快迭代
quick_abi = "cp311"
