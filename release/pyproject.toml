# pyproject.toml —— 发布流水线的构建依赖与工具配置
#
# 开源版打包流水线只需要标准库（zipfile / shutil），不再依赖
# Cython / PyArmor 等三方构建工具。此文件保留是为了：
#   1. 让 release/ 目录在 uv / pip 等工具眼里是一个"合法的、什么都不装"的项目
#      （避免 flat-layout 自动发现把 build_cache/ 当成包）
#   2. 记录一份"发布流水线的元数据"（版本号来源、mzp 安装钩子路径等），
#      便于 CI/构建脚本读取。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxagent-release"
version = "0.0.0"
description = "MaxAgent 开源版打包流水线（源码直出 mzp）"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"

[tool.setuptools]
# 显式声明本项目不包含任何 Python 包/模块——release/ 下的子目录均为构建脚本
# 的工作区（build_cache/ 是中间产物、ci/ 是 CI 配置），
# 不应被打包成 wheel。
packages = []
py-modules = []

[tool.maxagent-release]
# 单一版本号源
version_file = "version.py"
# 安装钩子
mzp_install_script = "mzp_install.ms"
# 中间产物 / 最终产物
build_cache_dir = "build_cache"
dist_dir = "dist"

# 哪些 ABI 需要打进 mzp（供 mzp_install.ms 按 Max 的 Python 版本挑选）
[tool.maxagent-release.abi_matrix]
required = ["cp37", "cp39", "cp310", "cp311", "cp313"]
